# ============================================================
# LumenLiquid Backend — Production Stack (Dokploy / shared Traefik)
# ============================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   (or make prod-up)
#
# This server already runs Dokploy's Traefik (owns :80/:443) with a
# `letsencrypt` certresolver and watches the external `dokploy-network`.
# We do NOT run our own Traefik — the `api` service joins dokploy-network
# and is routed via Traefik labels (same pattern as the Jira stack).
#
# Before first run, copy .env.prod.example → .env and fill in values.
# DATABASE_URL / REDIS_URL use service names (postgres / redis).
#
# Startup order:
#   postgres(healthy) ─┬─ migrate ── indexer-replay ─┬─ indexer
#   redis(healthy) ────┘                              ├─ api
#                                                     ├─ keeper
#                                                     └─ sleeper ── ofelia
# ============================================================

x-image: &app-image ghcr.io/thainq01/lumen-liquid-backend:${IMAGE_TAG:-latest}
x-restart: &restart unless-stopped
x-internal: &internal
  networks:
    - internal
x-env: &env
  env_file:
    - .env

# ── Networks ───────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: false      # allows outbound traffic (Soroban RPC, Binance WS)
  dokploy-network:
    external: true       # Dokploy's Traefik watches this network

# ── Volumes ────────────────────────────────────────────────
volumes:
  pgdata:
  redisdata:

# ── Services ───────────────────────────────────────────────
services:

  # ── Infrastructure ────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    <<: *internal
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumenliquid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lumen"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: *restart

  redis:
    image: redis:7-alpine
    <<: *internal
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: *restart

  # ── Boot sequence ─────────────────────────────────────────

  migrate:
    image: *app-image
    command: ["migrate", "up"]
    <<: [*internal, *env]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  indexer-replay:
    image: *app-image
    command: ["indexer-replay"]
    <<: [*internal, *env]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # ── Long-running services ─────────────────────────────────

  indexer:
    image: *app-image
    command: ["indexer"]
    <<: [*internal, *env]
    depends_on:
      indexer-replay:
        condition: service_completed_successfully

  api:
    image: *app-image
    command: ["api"]
    <<: [*internal, *env]
    networks:
      - internal
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.lumenliquid-api.loadbalancer.server.port=8080"
      # HTTPS router
      - "traefik.http.routers.lumenliquid-api.rule=Host(`${DOMAIN?DOMAIN is required}`)"
      - "traefik.http.routers.lumenliquid-api.entrypoints=websecure"
      - "traefik.http.routers.lumenliquid-api.tls.certresolver=letsencrypt"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.lumenliquid-api-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.lumenliquid-api-http.entrypoints=web"
      - "traefik.http.routers.lumenliquid-api-http.middlewares=lumenliquid-api-redirect@docker"
      - "traefik.http.middlewares.lumenliquid-api-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lumenliquid-api-redirect.redirectscheme.permanent=true"
    restart: *restart

  keeper:
    image: *app-image
    command: ["keeper"]
    <<: [*internal, *env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: *restart

  # ── Cron-worker container (stays alive so Ofelia can exec) ──

  sleeper:
    image: *app-image
    command: ["sleep", "infinity"]
    <<: [*internal, *env]
    container_name: lumenliquid-sleeper
    depends_on:
      indexer-replay:
        condition: service_completed_successfully
    restart: *restart
    labels:
      ofelia.enabled: "true"
      # Daily indexer-replay at 04:00
      ofelia.job-exec.replay.schedule: "0 4 * * *"
      ofelia.job-exec.replay.command: "indexer-replay"
      # Daily pair-indexer at 04:30
      ofelia.job-exec.pair-indexer.schedule: "30 4 * * *"
      ofelia.job-exec.pair-indexer.command: "pair-indexer"

  # ── Scheduler ─────────────────────────────────────────────

  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    <<: *internal
    restart: *restart
    depends_on:
      sleeper:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
